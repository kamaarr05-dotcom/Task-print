name: Deploy PrintFlow to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: printflow-pages
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  build:
    runs-on: ubuntu-latest

    environment:
      name: github-pages

    steps:
      # 1. Ambil source code dari repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # 3. Cari project PrintFlow
      #    Mendukung repository yang berisi package.json langsung
      #    maupun repository yang masih menyimpan project dalam ZIP.
      - name: Prepare project
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "package.json" ]; then
            echo "PROJECT_DIR=$PWD" >> "$GITHUB_ENV"
            exit 0
          fi

          ZIP_FILE=$(find . -maxdepth 3 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: package.json atau ZIP project tidak ditemukan."
            exit 1
          fi

          echo "ZIP ditemukan: $ZIP_FILE"

          rm -rf .printflow-project
          mkdir -p .printflow-project

          unzip -o "$ZIP_FILE" -d .printflow-project >/dev/null

          PACKAGE_FILE=$(find .printflow-project \
            -type f \
            -name "package.json" \
            -print -quit)

          if [ -z "$PACKAGE_FILE" ]; then
            echo "ERROR: package.json tidak ditemukan di dalam ZIP."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PACKAGE_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project directory: $PROJECT_DIR"

      # 4. Install dependency
      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npm install --no-audit --no-fund

      # 5. Buat environment production
      - name: Configure Supabase environment
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$SUPABASE_URL" ]; then
            echo "ERROR: VITE_SUPABASE_URL belum dibuat di GitHub Secrets."
            exit 1
          fi

          if [ -z "$SUPABASE_KEY" ]; then
            echo "ERROR: VITE_SUPABASE_PUBLISHABLE_KEY belum dibuat di GitHub Secrets."
            exit 1
          fi

          cat > .env.production <<EOF
          VITE_SUPABASE_URL=$SUPABASE_URL
          VITE_SUPABASE_PUBLISHABLE_KEY=$SUPABASE_KEY
          VITE_SUPABASE_ANON_KEY=$SUPABASE_KEY
          EOF

      # 6. Pastikan base URL GitHub Pages benar
      - name: Configure GitHub Pages base path
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("vite.config.ts")

          if not path.exists():
              raise SystemExit("ERROR: vite.config.ts tidak ditemukan.")

          content = path.read_text()

          if re.search(r"base\s*:", content):
              content = re.sub(
                  r"base\s*:\s*['\"][^'\"]*['\"]",
                  "base: '/Task-print/'",
                  content,
                  count=1
              )
          else:
              content = content.replace(
                  "return {",
                  "return {\n    base: '/Task-print/',",
                  1
              )

          path.write_text(content)

          print("GitHub Pages base path: /Task-print/")

          PY

      # 7. TypeScript check
      #    Kalau ada error TypeScript, deployment dihentikan.
      - name: Check TypeScript
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npm run lint

      # 8. Build aplikasi
      - name: Build PrintFlow
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npm run build

      # 9. Pastikan hasil build benar-benar static
      - name: Verify build
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "dist/index.html" ]; then
            echo "ERROR: dist/index.html tidak ditemukan."
            exit 1
          fi

          if [ -f "dist/server.cjs" ]; then
            echo "ERROR: server.cjs ditemukan."
            echo "GitHub Pages hanya boleh menjalankan frontend static."
            exit 1
          fi

          echo "Build PrintFlow berhasil."
          echo "Output: $PWD/dist"

      # 10. Setup GitHub Pages
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      # 11. Upload hasil build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.PROJECT_DIR }}/dist

  deploy:
    needs: build

    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # 12. Deploy ke GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4PRINTFLOW BERHASIL DI-DEPLOY"
          echo "=========================================="
          echo ""
          echo "Website:"
          echo "${{ steps.deployment.outputs.page_url }}"
          echo ""
          echo "=========================================="
