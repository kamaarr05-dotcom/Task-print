name: Deploy PrintFlow to GitHub Pages + Supabase

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: printflow-pages
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

jobs:

  # ============================================================
  # BUILD FRONTEND + DEPLOY SUPABASE EDGE FUNCTIONS
  # ============================================================
  build-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages

    steps:

      # --------------------------------------------------------
      # 1. CHECKOUT
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # 2. NODE.JS
      # --------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      # --------------------------------------------------------
      # 3. FIND PROJECT
      #
      # Mendukung:
      # - package.json langsung di root
      # - project berada di dalam ZIP
      # --------------------------------------------------------
      - name: Prepare project
        shell: bash
        run: |
          set -euo pipefail

          if [ -f package.json ]; then
            echo "Project ditemukan di root repository."
            echo "PROJECT_DIR=$PWD" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "package.json tidak ditemukan di root."

          ZIP_FILE=$(find . -maxdepth 3 -type f -iname '*.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: package.json dan ZIP tidak ditemukan."
            exit 1
          fi

          echo "ZIP ditemukan:"
          echo "$ZIP_FILE"

          rm -rf .printflow-project
          mkdir -p .printflow-project

          unzip -o "$ZIP_FILE" -d .printflow-project >/dev/null

          PACKAGE_FILE=$(find .printflow-project \
            -type f \
            -name package.json \
            -print \
            -quit)

          if [ -z "$PACKAGE_FILE" ]; then
            echo "ERROR: package.json tidak ditemukan di dalam ZIP."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PACKAGE_FILE")

          echo "Project directory:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # --------------------------------------------------------
      # 4. INSTALL DEPENDENCIES
      # --------------------------------------------------------
      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npm install --no-audit --no-fund

      # --------------------------------------------------------
      # 5. VALIDATE SUPABASE SECRETS
      # --------------------------------------------------------
      - name: Validate Supabase configuration
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$SUPABASE_URL" ]; then
            echo "ERROR: VITE_SUPABASE_URL belum dibuat."
            exit 1
          fi

          if [ -z "$SUPABASE_KEY" ]; then
            echo "ERROR: VITE_SUPABASE_PUBLISHABLE_KEY belum dibuat."
            exit 1
          fi

          echo "Supabase configuration OK."

      # --------------------------------------------------------
      # 6. CREATE PRODUCTION ENVIRONMENT
      # --------------------------------------------------------
      - name: Configure Supabase environment
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          cat > .env.production <<EOF
          VITE_SUPABASE_URL=$SUPABASE_URL
          VITE_SUPABASE_PUBLISHABLE_KEY=$SUPABASE_KEY
          VITE_SUPABASE_ANON_KEY=$SUPABASE_KEY
          EOF

          echo ".env.production berhasil dibuat."

      # --------------------------------------------------------
      # 7. FORCE GITHUB PAGES BASE PATH
      #
      # Website:
      # https://kamaar05-dotcom.github.io/Task-print/
      # --------------------------------------------------------
      - name: Configure GitHub Pages base path
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("vite.config.ts")

          if not path.exists():
              raise SystemExit(
                  "ERROR: vite.config.ts tidak ditemukan."
              )

          text = path.read_text()

          if re.search(r'base\s*:', text):
              text = re.sub(
                  r'base\s*:\s*[\'"][^\'"]*[\'"]',
                  "base: '/Task-print/'",
                  text,
                  count=1
              )
          else:
              if "return {" in text:
                  text = text.replace(
                      "return {",
                      "return {\n    base: '/Task-print/',",
                      1
                  )
              else:
                  raise SystemExit(
                      "ERROR: format vite.config.ts tidak dikenali."
                  )

          path.write_text(text)

          print("Base path = /Task-print/")
          PY

      # --------------------------------------------------------
      # 8. TYPE CHECK
      #
      # tsconfig.json sudah diarahkan hanya ke src/
      # sehingga Deno Edge Functions tidak diperiksa oleh tsc.
      # --------------------------------------------------------
      - name: Type-check frontend
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npm run lint

      # --------------------------------------------------------
      # 9. BUILD FRONTEND
      # --------------------------------------------------------
      - name: Build static frontend
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npm run build

      # --------------------------------------------------------
      # 10. VERIFY BUILD
      # --------------------------------------------------------
      - name: Verify static build
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f dist/index.html ]; then
            echo "ERROR: dist/index.html tidak ditemukan."
            exit 1
          fi

          if [ -f dist/server.cjs ]; then
            echo "ERROR: dist/server.cjs masih ada."
            echo "GitHub Pages harus menggunakan frontend static."
            exit 1
          fi

          echo "=========================================="
          echo "STATIC BUILD BERHASIL"
          echo "=========================================="

          find dist -maxdepth 2 -type f | sort

      # --------------------------------------------------------
      # 11. SETUP GITHUB PAGES
      # --------------------------------------------------------
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      # --------------------------------------------------------
      # 12. UPLOAD PAGES ARTIFACT
      # --------------------------------------------------------
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ env.PROJECT_DIR }}/dist

      # ========================================================
      # SUPABASE EDGE FUNCTIONS
      # ========================================================

      # --------------------------------------------------------
      # 13. VALIDATE SUPABASE DEPLOYMENT SECRETS
      # --------------------------------------------------------
      - name: Validate Supabase deployment secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "ERROR: SUPABASE_ACCESS_TOKEN belum dibuat."
            exit 1
          fi

          if [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "ERROR: SUPABASE_PROJECT_REF belum dibuat."
            exit 1
          fi

          echo "Supabase deployment secrets OK."

      # --------------------------------------------------------
      # 14. INSTALL SUPABASE CLI
      # --------------------------------------------------------
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # --------------------------------------------------------
      # 15. DEPLOY EDGE FUNCTIONS
      #
      # Deno ditangani oleh Supabase CLI.
      # Tidak diperiksa oleh npm run lint.
      # --------------------------------------------------------
      - name: Deploy Supabase Edge Functions
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        shell: bash
        run: |
          set -euo pipefail

          FUNCTIONS="
          admin-create-user
          admin-delete-user
          master-create-tenant
          ai-task-print
          "

          for fn in $FUNCTIONS; do

            echo ""
            echo "=========================================="
            echo "Deploying: $fn"
            echo "=========================================="

            if [ ! -f "supabase/functions/$fn/index.ts" ]; then
              echo "ERROR: File function tidak ditemukan:"
              echo "supabase/functions/$fn/index.ts"
              exit 1
            fi

            supabase functions deploy "$fn" \
              --project-ref "$SUPABASE_PROJECT_REF" \
              --no-verify-jwt

            echo "SUCCESS: $fn"

          done

      # --------------------------------------------------------
      # 16. SUMMARY
      # --------------------------------------------------------
      - name: Deployment summary
        run: |
          echo ""
          echo "=========================================="
          echo "PRINTFLOW READY"
          echo "=========================================="
          echo "Frontend : GitHub Pages"
          echo "Auth     : Supabase Auth"
          echo "Database : Supabase"
          echo "Storage  : Supabase Storage"
          echo "Realtime : Supabase Realtime"
          echo "Backend  : Supabase Edge Functions"
          echo "=========================================="


  # ============================================================
  # DEPLOY GITHUB PAGES
  # ============================================================
  deploy-pages:
    needs: build-and-deploy

    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages

    steps:

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
