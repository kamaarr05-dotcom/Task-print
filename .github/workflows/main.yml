name: Deploy PrintFlow to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: printflow-pages
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  build:
    name: Build PrintFlow
    runs-on: ubuntu-latest

    environment:
      name: github-pages

    steps:
      # ==========================================
      # 1. Checkout repository
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. Setup Node.js
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      # ==========================================
      # 3. Cari folder project
      # ==========================================
      - name: Prepare project
        shell: bash
        run: |
          set -euo pipefail

          echo "Mencari package.json..."

          PACKAGE_FILE=$(find . \
            -type f \
            -name package.json \
            -not -path './node_modules/*' \
            -print \
            -quit)

          if [ -z "$PACKAGE_FILE" ]; then
            echo ""
            echo "ERROR: package.json tidak ditemukan."
            echo ""
            echo "Isi repository:"
            find . -maxdepth 3 -type f | sort | head -200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PACKAGE_FILE")

          echo ""
          echo "package.json ditemukan:"
          echo "$PACKAGE_FILE"
          echo ""
          echo "PROJECT_DIR=$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # ==========================================
      # 4. Install dependencies
      # ==========================================
      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npm install --no-audit --no-fund

      # ==========================================
      # 5. Konfigurasi Supabase
      # ==========================================
      - name: Configure Supabase
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$SUPABASE_URL" ]; then
            echo "ERROR: VITE_SUPABASE_URL belum dibuat."
            exit 1
          fi

          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "ERROR: VITE_SUPABASE_ANON_KEY belum dibuat."
            exit 1
          fi

          cat > .env.production <<EOF
          VITE_SUPABASE_URL=$SUPABASE_URL
          VITE_SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
          VITE_SUPABASE_PUBLISHABLE_KEY=$SUPABASE_ANON_KEY
          EOF

          echo "Supabase configuration OK."

      # ==========================================
      # 6. GitHub Pages base path
      # ==========================================
      - name: Configure GitHub Pages base path
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("vite.config.ts")

          if not path.exists():
              raise SystemExit(
                  "ERROR: vite.config.ts tidak ditemukan."
              )

          text = path.read_text()

          if re.search(r'base\s*:', text):
              text = re.sub(
                  r'base\s*:\s*[\'"][^\'"]*[\'"]',
                  "base: '/Task-print/'",
                  text,
                  count=1
              )
          else:
              if "return {" in text:
                  text = text.replace(
                      "return {",
                      "return {\n    base: '/Task-print/',",
                      1
                  )
              else:
                  raise SystemExit(
                      "ERROR: format vite.config.ts tidak dikenali."
                  )

          path.write_text(text)

          print("Base path = /Task-print/")
          PY

      # ==========================================
      # 7. Type check
      # ==========================================
      - name: Type-check frontend
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npm run lint

      # ==========================================
      # 8. Build
      # ==========================================
      - name: Build PrintFlow
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npm run build

      # ==========================================
      # 9. Verifikasi build
      # ==========================================
      - name: Verify build
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f dist/index.html ]; then
            echo "ERROR: dist/index.html tidak ditemukan."
            exit 1
          fi

          if [ -f dist/server.cjs ]; then
            echo "ERROR: dist/server.cjs masih ada."
            echo "GitHub Pages membutuhkan frontend static."
            exit 1
          fi

          echo "=========================================="
          echo "PRINTFLOW BUILD BERHASIL"
          echo "=========================================="

          find dist -maxdepth 2 -type f | sort

      # ==========================================
      # 10. Setup GitHub Pages
      # ==========================================
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      # ==========================================
      # 11. Upload artifact
      # ==========================================
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ env.PROJECT_DIR }}/dist

  # ============================================
  # DEPLOY
  # ============================================
  deploy:
    name: Deploy to GitHub Pages
    needs: build

    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
