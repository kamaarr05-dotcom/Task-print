name: Build PrintFlow

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build PrintFlow
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout repository
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. Setup Node.js
      # ==========================================
      - name: Setup Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      # ==========================================
      # 3. Check versions
      # ==========================================
      - name: Check versions
        run: |
          set -e

          echo "Node:"
          node --version

          echo "NPM:"
          npm --version

      # ==========================================
      # 4. Prepare project
      #
      # Kalau package.json sudah di root:
      #     langsung digunakan
      #
      # Kalau package.json ada di dalam ZIP:
      #     ZIP otomatis diekstrak
      # ==========================================
      - name: Prepare project
        shell: bash
        run: |
          set -e

          echo "Checking project files..."
          echo ""

          if [ -f "package.json" ]; then
            echo "package.json ditemukan di root repository."

            PROJECT_DIR="$(pwd)"

          else
            echo "package.json tidak ditemukan di root."
            echo "Mencari file ZIP..."

            ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: Tidak ditemukan package.json maupun file ZIP."
              echo ""
              echo "Isi repository:"
              find . -maxdepth 3 -type f | sort
              exit 1
            fi

            echo "ZIP ditemukan:"
            echo "$ZIP_FILE"

            mkdir -p .printflow-extracted

            echo ""
            echo "Extract ZIP..."

            unzip -o "$ZIP_FILE" -d .printflow-extracted

            echo ""
            echo "Mencari package.json setelah extract..."

            PACKAGE_FILE=$(find .printflow-extracted \
              -type f \
              -name "package.json" \
              -print -quit)

            if [ -z "$PACKAGE_FILE" ]; then
              echo "ERROR: package.json tidak ditemukan di dalam ZIP."
              echo ""
              echo "Isi hasil extract:"
              find .printflow-extracted -maxdepth 5 -type f | sort
              exit 1
            fi

            PROJECT_DIR="$(dirname "$PACKAGE_FILE")"

            echo ""
            echo "Project ditemukan:"
            echo "$PROJECT_DIR"
          fi

          echo ""
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "Project files:"
          find "$PROJECT_DIR" -maxdepth 2 -type f | sort | head -200

          echo ""
          echo "package.json:"
          cat "$PROJECT_DIR/package.json"

      # ==========================================
      # 5. Validate Supabase configuration
      # ==========================================
      - name: Validate Supabase configuration
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -e

          if [ -z "$SUPABASE_URL" ]; then
            echo "ERROR: VITE_SUPABASE_URL belum dibuat di GitHub Secrets."
            exit 1
          fi

          if [ -z "$SUPABASE_KEY" ]; then
            echo "ERROR: VITE_SUPABASE_PUBLISHABLE_KEY belum dibuat di GitHub Secrets."
            exit 1
          fi

          echo "Supabase configuration OK."

      # ==========================================
      # 6. Install dependencies
      # ==========================================
      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "Installing dependencies..."

          npm install --no-audit --no-fund

      # ==========================================
      # 7. Configure Supabase environment
      # ==========================================
      - name: Configure Supabase environment
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -e

          cat > .env.production <<EOF
          VITE_SUPABASE_URL=${SUPABASE_URL}
          VITE_SUPABASE_PUBLISHABLE_KEY=${SUPABASE_KEY}
          EOF

          echo ".env.production created."

      # ==========================================
      # 8. TypeScript check
      # ==========================================
      - name: TypeScript check
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          npm run lint

      # ==========================================
      # 9. Build web application
      # ==========================================
      - name: Build web application
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          set -e

          npm run build

      # ==========================================
      # 10. Verify build
      # ==========================================
      - name: Verify build output
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "Checking dist..."

          if [ ! -d "dist" ]; then
            echo "ERROR: folder dist tidak ditemukan."
            exit 1
          fi

          if [ ! -f "dist/server.cjs" ]; then
            echo "ERROR: dist/server.cjs tidak ditemukan."
            echo ""
            echo "Isi dist:"
            find dist -maxdepth 3 -type f | sort
            exit 1
          fi

          echo ""
          echo "BUILD BERHASIL!"
          echo ""
          echo "Isi dist:"
          find dist -maxdepth 3 -type f | sort

      # ==========================================
      # 11. Upload production build
      # ==========================================
      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: printflow-production
          path: |
            ${{ env.PROJECT_DIR }}/dist/**
            ${{ env.PROJECT_DIR }}/package.json
            ${{ env.PROJECT_DIR }}/package-lock.json
          if-no-files-found: error
          retention-days: 14
