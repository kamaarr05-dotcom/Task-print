name: Deploy PrintFlow to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build PrintFlow Frontend
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. CHECKOUT REPOSITORY
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. SETUP NODE.JS
      # ==========================================
      - name: Setup Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      # ==========================================
      # 3. CHECK NODE / NPM
      # ==========================================
      - name: Check versions
        run: |
          set -e

          echo "Node:"
          node --version

          echo "NPM:"
          npm --version

      # ==========================================
      # 4. FIND AND EXTRACT ZIP PROJECT
      # ==========================================
      - name: Prepare project
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "Mencari package.json..."
          echo "=========================================="

          # Kalau package.json sudah langsung di root
          if [ -f "package.json" ]; then

            echo "package.json ditemukan di root."

            PROJECT_DIR="$(pwd)"

          else

            echo "package.json tidak ditemukan di root."
            echo "Mencari file ZIP..."

            ZIP_FILE=$(find . -maxdepth 3 -type f -iname "*.zip" | head -n 1)

            if [ -z "$ZIP_FILE" ]; then
              echo ""
              echo "ERROR: ZIP project tidak ditemukan."
              echo ""
              echo "Isi repository:"
              find . -maxdepth 3 -type f | sort
              exit 1
            fi

            echo ""
            echo "ZIP ditemukan:"
            echo "$ZIP_FILE"

            # Folder extract
            rm -rf .printflow-project
            mkdir -p .printflow-project

            echo ""
            echo "Extract ZIP..."

            unzip -o "$ZIP_FILE" -d .printflow-project

            echo ""
            echo "Mencari package.json..."

            PACKAGE_FILE=$(find .printflow-project \
              -type f \
              -name "package.json" \
              -print -quit)

            if [ -z "$PACKAGE_FILE" ]; then

              echo ""
              echo "ERROR: package.json tidak ditemukan di dalam ZIP."
              echo ""
              echo "Isi ZIP:"
              find .printflow-project -maxdepth 5 -type f | sort

              exit 1
            fi

            PROJECT_DIR="$(dirname "$PACKAGE_FILE")"

            echo ""
            echo "Project ditemukan:"
            echo "$PROJECT_DIR"

          fi

          echo ""
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "=========================================="
          echo "PROJECT DIRECTORY"
          echo "=========================================="

          echo "$PROJECT_DIR"

          echo ""
          echo "File project:"
          find "$PROJECT_DIR" -maxdepth 2 -type f | sort | head -200

          echo ""
          echo "package.json:"
          cat "$PROJECT_DIR/package.json"

      # ==========================================
      # 5. VALIDATE SUPABASE
      # ==========================================
      - name: Validate Supabase configuration
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -e

          if [ -z "$SUPABASE_URL" ]; then
            echo "ERROR: VITE_SUPABASE_URL belum dibuat di GitHub Secrets."
            exit 1
          fi

          if [ -z "$SUPABASE_KEY" ]; then
            echo "ERROR: VITE_SUPABASE_PUBLISHABLE_KEY belum dibuat di GitHub Secrets."
            exit 1
          fi

          echo "Supabase configuration OK."

      # ==========================================
      # 6. INSTALL DEPENDENCIES
      # ==========================================
      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "Installing dependencies..."

          npm install --no-audit --no-fund

      # ==========================================
      # 7. CREATE SUPABASE ENVIRONMENT
      # ==========================================
      - name: Configure Supabase environment
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -e

          cat > .env.production <<EOF
          VITE_SUPABASE_URL=${SUPABASE_URL}
          VITE_SUPABASE_PUBLISHABLE_KEY=${SUPABASE_KEY}
          VITE_SUPABASE_ANON_KEY=${SUPABASE_KEY}
          EOF

          echo ".env.production created."

      # ==========================================
      # 8. CONFIGURE VITE FOR GITHUB PAGES
      #
      # Repository:
      # kamaar05-dotcom/Task-print
      #
      # URL:
      # https://kamaar05-dotcom.github.io/Task-print/
      # ==========================================
      - name: Configure Vite base path
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "Configuring Vite base path..."

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("vite.config.ts")

          if not path.exists():
              print("vite.config.ts tidak ditemukan.")
              print("Membuat vite.config.ts baru...")

              path.write_text(
                  """import { defineConfig } from 'vite';
          import react from '@vitejs/plugin-react';
          import tailwindcss from '@tailwindcss/vite';

          export default defineConfig({
            base: '/Task-print/',
            plugins: [react(), tailwindcss()],
          });
          """,
                  encoding="utf-8"
              )

          else:
              text = path.read_text(encoding="utf-8")

              # Jika sudah ada base, ganti nilainya
              if re.search(r"base\s*:", text):
                  text = re.sub(
                      r"base\s*:\s*['\"][^'\"]*['\"]",
                      "base: '/Task-print/'",
                      text
                  )

              # Jika belum ada base, masukkan ke return object
              else:
                  text = text.replace(
                      "return {",
                      "return {\n    base: '/Task-print/',",
                      1
                  )

              path.write_text(text, encoding="utf-8")

          print("")
          print("vite.config.ts:")
          print(path.read_text(encoding="utf-8"))
          PY

      # ==========================================
      # 9. BUILD FRONTEND ONLY
      #
      # PENTING:
      # Tidak menggunakan npm run build karena
      # script project juga membuild server.ts.
      #
      # GitHub Pages hanya membutuhkan frontend.
      # ==========================================
      - name: Build frontend
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -e

          echo "Building Vite frontend..."

          npx vite build

      # ==========================================
      # 10. VERIFY DIST
      # ==========================================
      - name: Verify frontend build
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          if [ ! -d "dist" ]; then
            echo "ERROR: folder dist tidak ditemukan."
            exit 1
          fi

          if [ ! -f "dist/index.html" ]; then
            echo "ERROR: dist/index.html tidak ditemukan."
            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "BUILD BERHASIL"
          echo "=========================================="

          echo ""
          echo "Isi dist:"
          find dist -maxdepth 3 -type f | sort

      # ==========================================
      # 11. CONFIGURE GITHUB PAGES
      # ==========================================
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      # ==========================================
      # 12. UPLOAD PAGES ARTIFACT
      # ==========================================
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ env.PROJECT_DIR }}/dist

  # ============================================
  # DEPLOY JOB
  # ============================================
  deploy:
    name: Deploy PrintFlow
    runs-on: ubuntu-latest

    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      pages: write
      id-token: write

    steps:

      # ==========================================
      # 13. DEPLOY TO GITHUB PAGES
      # ==========================================
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # ==========================================
      # 14. SHOW WEBSITE URL
      # ==========================================
      - name: Show application URL
        run: |
          echo ""
          echo "=========================================="
          echo "PRINTFLOW BERHASIL DI-DEPLOY"
          echo "=========================================="
          echo ""
          echo "Website:"
          echo "${{ steps.deployment.outputs.page_url }}"
          echo ""
          echo "=========================================="
