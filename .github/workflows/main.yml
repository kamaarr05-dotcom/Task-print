name: Build PrintFlow Web App

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build PrintFlow
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 1. CHECKOUT SOURCE
      # ==========================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================================
      # 2. JAVA JDK 21
      # ==========================================================
      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: npm


      # ==========================================================
      # 3. NODE.JS 20
      # ==========================================================
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm


      # ==========================================================
      # 4. VERIFY ENVIRONMENT
      # ==========================================================
      - name: Check versions
        run: |
          echo "Java:"
          java -version

          echo "Node:"
          node --version

          echo "NPM:"
          npm --version


      # ==========================================================
      # 5. CHECK REQUIRED SUPABASE SECRETS
      # ==========================================================
      - name: Validate Supabase configuration
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -e

          if [ -z "$SUPABASE_URL" ]; then
            echo "ERROR: VITE_SUPABASE_URL belum dibuat di GitHub Secrets."
            exit 1
          fi

          if [ -z "$SUPABASE_KEY" ]; then
            echo "ERROR: VITE_SUPABASE_PUBLISHABLE_KEY belum dibuat di GitHub Secrets."
            exit 1
          fi

          echo "Supabase configuration detected."


      # ==========================================================
      # 6. INSTALL DEPENDENCIES
      # ==========================================================
      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund


      # ==========================================================
      # 7. CREATE BUILD ENVIRONMENT
      #
      # VITE_* dipakai oleh frontend React/Vite.
      # ==========================================================
      - name: Configure Supabase environment
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          cat > .env.production <<EOF
          VITE_SUPABASE_URL=${SUPABASE_URL}
          VITE_SUPABASE_PUBLISHABLE_KEY=${SUPABASE_KEY}
          EOF

          echo ".env.production created."


      # ==========================================================
      # 8. TYPESCRIPT CHECK
      # ==========================================================
      - name: TypeScript check
        run: npm run lint


      # ==========================================================
      # 9. BUILD WEB APP
      #
      # Supabase URL + publishable key tersedia saat Vite build.
      # ==========================================================
      - name: Build web application
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          npm run build


      # ==========================================================
      # 10. VERIFY BUILD
      # ==========================================================
      - name: Verify build output
        run: |
          set -e

          if [ ! -d "dist" ]; then
            echo "ERROR: dist tidak ditemukan."
            exit 1
          fi

          if [ ! -f "dist/server.cjs" ]; then
            echo "ERROR: dist/server.cjs tidak ditemukan."
            exit 1
          fi

          echo "Build berhasil."
          echo ""
          echo "Isi dist:"
          find dist -maxdepth 2 -type f | sort


      # ==========================================================
      # 11. UPLOAD BUILD ARTIFACT
      # ==========================================================
      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: printflow-production
          path: |
            dist/**
            package.json
            package-lock.json
            .env.example
          if-no-files-found: error
          retention-days: 14
