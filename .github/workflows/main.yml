name: Deploy PrintFlow to GitHub Pages + Supabase

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: printflow-pages
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

jobs:

  # ============================================================
  # BUILD FRONTEND + DEPLOY SUPABASE EDGE FUNCTIONS
  # ============================================================
  build-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages

    steps:

      # --------------------------------------------------------
      # Checkout repository
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Setup Node.js
      # --------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      # --------------------------------------------------------
      # Find project
      #
      # Bisa langsung package.json di root,
      # atau project masih berada di dalam ZIP.
      # --------------------------------------------------------
      - name: Prepare project from ZIP when necessary
        shell: bash
        run: |
          set -euo pipefail

          if [ -f package.json ]; then
            echo "Project ditemukan di root repository."
            echo "PROJECT_DIR=$PWD" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "package.json tidak ditemukan di root."

          ZIP_FILE=$(find . -maxdepth 3 -type f -iname '*.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: package.json dan ZIP tidak ditemukan."
            exit 1
          fi

          echo "ZIP ditemukan: $ZIP_FILE"

          rm -rf .printflow-project
          mkdir -p .printflow-project

          unzip -o "$ZIP_FILE" -d .printflow-project >/dev/null

          PACKAGE_FILE=$(find .printflow-project \
            -type f \
            -name package.json \
            -print \
            -quit)

          if [ -z "$PACKAGE_FILE" ]; then
            echo "ERROR: package.json tidak ditemukan di dalam ZIP."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PACKAGE_FILE")

          echo "Project directory: $PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # --------------------------------------------------------
      # Install dependencies
      # --------------------------------------------------------
      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npm install --no-audit --no-fund

      # --------------------------------------------------------
      # Configure Supabase environment untuk Vite
      # --------------------------------------------------------
      - name: Configure Supabase environment
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$SUPABASE_URL" ]; then
            echo "ERROR: VITE_SUPABASE_URL belum dibuat di GitHub Secrets."
            exit 1
          fi

          if [ -z "$SUPABASE_KEY" ]; then
            echo "ERROR: VITE_SUPABASE_PUBLISHABLE_KEY belum dibuat di GitHub Secrets."
            exit 1
          fi

          cat > .env.production <<EOF
          VITE_SUPABASE_URL=$SUPABASE_URL
          VITE_SUPABASE_PUBLISHABLE_KEY=$SUPABASE_KEY
          VITE_SUPABASE_ANON_KEY=$SUPABASE_KEY
          EOF

          echo "Supabase environment berhasil dibuat."

      # --------------------------------------------------------
      # Pastikan base path GitHub Pages benar
      #
      # URL:
      # https://kamaar05-dotcom.github.io/Task-print/
      # --------------------------------------------------------
      - name: Ensure GitHub Pages base path
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("vite.config.ts")

          if not p.exists():
              raise SystemExit("ERROR: vite.config.ts tidak ditemukan.")

          s = p.read_text()

          if re.search(r'base\s*:', s):
              s = re.sub(
                  r'base\s*:\s*[\'"][^\'"]*[\'"]',
                  "base: '/Task-print/'",
                  s,
                  count=1
              )
          else:
              if "return {" in s:
                  s = s.replace(
                      "return {",
                      "return {\n    base: '/Task-print/',",
                      1
                  )
              else:
                  raise SystemExit(
                      "ERROR: format vite.config.ts tidak dikenali."
                  )

          p.write_text(s)

          print("GitHub Pages base path: /Task-print/")
          PY

      # --------------------------------------------------------
      # TypeScript check
      # --------------------------------------------------------
      - name: Type-check project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npm run lint

      # --------------------------------------------------------
      # Build frontend
      # --------------------------------------------------------
      - name: Build static frontend
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npm run build

      # --------------------------------------------------------
      # Verify hasil build
      # --------------------------------------------------------
      - name: Verify static build
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f dist/index.html ]; then
            echo "ERROR: dist/index.html tidak ditemukan."
            exit 1
          fi

          if [ -f dist/server.cjs ]; then
            echo "ERROR: server.cjs masih masuk ke build."
            echo "GitHub Pages hanya membutuhkan frontend static."
            exit 1
          fi

          echo "Build frontend berhasil."
          echo "GitHub Pages frontend siap."

      # --------------------------------------------------------
      # Setup GitHub Pages
      # --------------------------------------------------------
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      # --------------------------------------------------------
      # Upload frontend artifact
      # --------------------------------------------------------
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ env.PROJECT_DIR }}/dist

      # ========================================================
      # SUPABASE EDGE FUNCTIONS
      # ========================================================

      # --------------------------------------------------------
      # Validasi secrets Supabase
      # --------------------------------------------------------
      - name: Validate Supabase deployment secrets
        env:
          ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$ACCESS_TOKEN" ]; then
            echo "ERROR: SUPABASE_ACCESS_TOKEN belum dibuat."
            exit 1
          fi

          if [ -z "$PROJECT_REF" ]; then
            echo "ERROR: SUPABASE_PROJECT_REF belum dibuat."
            exit 1
          fi

          echo "Supabase deployment secrets tersedia."

      # --------------------------------------------------------
      # Setup Supabase CLI
      # --------------------------------------------------------
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # --------------------------------------------------------
      # Deploy Edge Functions
      #
      # Digunakan untuk operasi yang tidak boleh dilakukan
      # langsung dari browser:
      #
      # admin-create-user
      # admin-delete-user
      # master-create-tenant
      # ai-task-print
      # --------------------------------------------------------
      - name: Deploy Supabase Edge Functions
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          FUNCTIONS="
          admin-create-user
          admin-delete-user
          master-create-tenant
          ai-task-print
          "

          for fn in $FUNCTIONS; do

            echo "=========================================="
            echo "Deploying Edge Function: $fn"
            echo "=========================================="

            if [ ! -f "supabase/functions/$fn/index.ts" ]; then
              echo "ERROR: Function $fn tidak ditemukan."
              exit 1
            fi

            supabase functions deploy "$fn" \
              --project-ref "$SUPABASE_PROJECT_REF" \
              --no-verify-jwt

            echo "Function $fn berhasil di-deploy."

          done

      # --------------------------------------------------------
      # Selesai
      # --------------------------------------------------------
      - name: Build and Supabase deployment summary
        run: |
          echo "=========================================="
          echo "PRINTFLOW DEPLOYMENT READY"
          echo "=========================================="
          echo "Frontend : GitHub Pages"
          echo "Database : Supabase"
          echo "Auth     : Supabase Auth"
          echo "Storage  : Supabase Storage"
          echo "Realtime : Supabase Realtime"
          echo "Backend  : Supabase Edge Functions"
          echo "=========================================="


  # ============================================================
  # DEPLOY GITHUB PAGES
  # ============================================================
  deploy-pages:
    needs: build-and-deploy

    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages

    steps:

      # --------------------------------------------------------
      # Deploy artifact ke GitHub Pages
      # --------------------------------------------------------
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
